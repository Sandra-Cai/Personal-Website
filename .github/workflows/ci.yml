name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify static assets
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/sandra-gpt.js
          test -f assets/script.js
          test -f robots.txt
          test -f sitemap.xml
          test -f 404.html
          test -f scripts/validate-jsonld.cjs
          test -f scripts/validate-basic-html.cjs
          test -f scripts/validate-metadata-files.cjs
          test -f scripts/verify-all.cjs
          test -f api/sandra-gpt.js
          test -f vercel.json
          test -f package.json
          test -f site.webmanifest
          test -f .npmrc
          test -f .well-known/security.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Verify site (JSON-LD + JS syntax)
        run: npm run verify
